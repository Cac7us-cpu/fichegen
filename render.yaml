# Déploiement GRATUIT en un clic sur Render (render.com > New > Blueprint).
# La base de données est sur Neon (gratuit) : colle son adresse dans DATABASE_URL.
# Les clés secrètes ne sont PAS ici : Render te les demandera pendant la création.
services:
  - type: web
    name: fichegen
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /sante
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: RESPONSABLE_RP
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5
      - key: CREDITS_GRATUITS
        value: "3"
      - key: FICHES_PAR_JOUR_TOTAL
        value: "100"
