{% extends "base.html" %}
{% block titre %}Inscription — {{ service }}{% endblock %}
{% block contenu %}
<div class="carte" style="max-width:440px;margin:0 auto">
  <h1 style="font-size:1.6rem">Créer un compte</h1>
  <form method="post" action="/inscription">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email">Courriel</label>
    <input id="email" type="email" name="email" required autocomplete="email">
    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" name="mdp" minlength="8" required autocomplete="new-password">
    <p class="aide">8 caractères minimum.</p>
    <label style="font-weight:400"><input type="checkbox" name="accepte" value="oui" required>
      J'accepte les <a href="/conditions" target="_blank">conditions d'utilisation</a> et la
      <a href="/confidentialite" target="_blank">politique de confidentialité</a>.</label>
    <p><button class="btn">Créer mon compte</button></p>
  </form>
  <p class="aide">Déjà inscrit ? <a href="/connexion">Connexion</a></p>
</div>
{% endblock %}
